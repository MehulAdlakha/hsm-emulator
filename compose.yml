name: hsm-emulator

services:
  hsm-console:
    image: nginx:alpine
    container_name: hsm-emulator-console
    ports:
      - "${HSM_PORT:-8013}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    restart: unless-stopped

  hsm-ai-bridge:
    image: python:3.11-alpine
    container_name: hsm-ai-bridge
    command: >
      python3 -c "print('Hindsight AI Connected for HSM PKCS#11 Emulator')"
    restart: "no"
